<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer ring -->
  <circle cx="20" cy="20" r="18" stroke="#4f8ef7" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Clock face -->
  <circle cx="20" cy="20" r="12" fill="#111827" stroke="#1e2d40" stroke-width="1"/>
  <!-- Hour markers -->
  <line x1="20" y1="9"  x2="20" y2="11" stroke="#8b9ab4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="29" x2="20" y2="31" stroke="#8b9ab4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9"  y1="20" x2="11" y2="20" stroke="#8b9ab4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="20" x2="31" y2="20" stroke="#8b9ab4" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~10) -->
  <line x1="20" y1="20" x2="15.5" y2="14" stroke="#4f8ef7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~2) -->
  <line x1="20" y1="20" x2="24.5" y2="14" stroke="#22d3a6" stroke-width="1" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="20" cy="20" r="1.5" fill="#4f8ef7"/>
  <!-- Spark top-right -->
  <circle cx="33" cy="9" r="1.5" fill="#22d3a6"/>
  <circle cx="36" cy="14" r="1" fill="#4f8ef7" opacity=".6"/>
  <circle cx="30" cy="5" r="1" fill="#4f8ef7" opacity=".4"/>
</svg>
