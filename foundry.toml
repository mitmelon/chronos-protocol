[profile.default]
src = "contracts"
test = "contracts/test"
out = "contracts/out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false
